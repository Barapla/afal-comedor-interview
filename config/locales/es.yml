es:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d %b"
      long: "%d de %B de %Y"
    day_names:
      - domingo
      - lunes
      - martes
      - miércoles
      - jueves
      - viernes
      - sábado
    abbr_day_names:
      - dom
      - lun
      - mar
      - mié
      - jue
      - vie
      - sáb
    month_names:
      -
      - enero
      - febrero
      - marzo
      - abril
      - mayo
      - junio
      - julio
      - agosto
      - septiembre
      - octubre
      - noviembre
      - diciembre
    abbr_month_names:
      -
      - ene
      - feb
      - mar
      - abr
      - may
      - jun
      - jul
      - ago
      - sep
      - oct
      - nov
      - dic
    order:
      - :day
      - :month
      - :year

  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d %b %H:%M"
      long: "%d de %B de %Y a las %H:%M"
    am: am
    pm: pm

  number:
    format:
      separator: "."
      delimiter: ","
      precision: 2
    currency:
      format:
        unit: "$"
        precision: 2
        separator: "."
        delimiter: ","
        format: "%u%n MXN"

  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "no puede estar vacío"
      taken: "ya está en uso"
      invalid: "no es válido"
      too_short: "es demasiado corto (mínimo %{count} caracteres)"
      too_long: "es demasiado largo (máximo %{count} caracteres)"
      not_a_number: "no es un número"
      greater_than: "debe ser mayor que %{count}"
      greater_than_or_equal_to: "debe ser mayor o igual a %{count}"
      inclusion: "no está incluido en la lista"
      record_invalid: "La validación falló: %{errors}"
      restrict_dependent_destroy:
        has_one: "No se puede eliminar porque tiene un %{record} dependiente"
        has_many: "No se puede eliminar porque tiene %{record} dependientes"

  activerecord:
    errors:
      messages:
        record_invalid: "La validación falló: %{errors}"
        restrict_dependent_destroy:
          has_one: "No se puede eliminar porque tiene un %{record} dependiente"
          has_many: "No se puede eliminar porque tiene %{record} dependientes"
